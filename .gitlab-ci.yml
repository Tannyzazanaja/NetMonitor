# =============================================================================
# NetMonitor Enterprise - GitLab CI/CD Pipeline Configuration
# Architecture:
#   - GitLab Server (Repo & CI/CD Runner): <GITLAB_SERVER_IP>
#   - Production Server (Target Deployment Host): <PROD_SERVER_IP>
# =============================================================================

stages:
  - test
  - build
  - deploy
  - verify

variables:
  # IP และพารามิเตอร์ของ Production Server (สามารถ Override ได้จากหน้าเว็บ GitLab CI/CD Variables)
  PROD_SERVER_IP: "192.168.109.147"
  PROD_SSH_USER: "root"
  PROD_APP_DIR: "/var/www/netmonitor-react"
  PROD_BACKUP_DIR: "/var/backups/netmonitor"
  
  # การตั้งค่า Node.js & NPM Cache
  NODE_VERSION: "20"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

# Caching dependencies ข้าม Stage เพื่อความเร็วในการรัน Pipeline
cache:
  key:
    files:
      - package-lock.json
      - server/package-lock.json
  paths:
    - .npm/
    - node_modules/
    - server/node_modules/

# -----------------------------------------------------------------------------
# 1. TEST STAGE: ตรวจสอบความปลอดภัยและรัน Unit Test ทุกชุด (18 Suites)
# -----------------------------------------------------------------------------
test:unit_and_security:
  stage: test
  image: node:20-bookworm-slim
  before_script:
    - node -v
    - npm -v
    # ติดตั้ง dependencies สำหรับทั้ง Frontend และ Backend
    - npm ci --prefer-offline --no-audit
    - cd server && npm ci --prefer-offline --no-audit && cd ..
  script:
    - echo "=== [1/2] Running NetMonitor Automated Test Suite ==="
    - npm test
    - echo "=== [2/2] Running Security & Secret Scan ==="
    - node scripts/security-scan.js
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# -----------------------------------------------------------------------------
# 2. BUILD STAGE: คอมไพล์ Frontend (React + Vite) เป็น Production Bundle
# -----------------------------------------------------------------------------
build:frontend:
  stage: build
  image: node:20-bookworm-slim
  dependencies:
    - test:unit_and_security
  before_script:
    - npm ci --prefer-offline --no-audit
  script:
    - echo "=== Building Vite Production Bundle ==="
    - npm run build
    - ls -lh dist/
  artifacts:
    name: "netmonitor-frontend-dist-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - dist/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# -----------------------------------------------------------------------------
# 3. DEPLOY STAGE: นำไฟล์ขึ้น Production Server แบบ Zero-Downtime
# รองรับทั้งแบบ Docker Compose และ PM2 / Native อัตโนมัติ (Auto-Detect)
# -----------------------------------------------------------------------------
deploy:production:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build:frontend
  before_script:
    # ติดตั้งเครื่องมือ SSH, Rsync, และ Curl บน Runner
    - apk add --no-cache openssh-client rsync curl bash
    # เริ่มต้น SSH Agent และโหลด Private Key จาก GitLab CI/CD Variables
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # ป้องกันคำถามยืนยัน SSH Key fingerprint สำหรับ Production Host
    - ssh-keyscan -H "$PROD_SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "=========================================================="
    - echo "🚀 Deploying NetMonitor to Production: $PROD_SSH_USER@$PROD_SERVER_IP"
    - echo "   Target Directory: $PROD_APP_DIR"
    - echo "   Commit: $CI_COMMIT_SHORT_SHA - $CI_COMMIT_TITLE"
    - echo "=========================================================="
    
    # 1. ตรวจสอบการเชื่อมต่อ SSH ไปยัง Production Server
    - ssh -o StrictHostKeyChecking=no "$PROD_SSH_USER@$PROD_SERVER_IP" "uname -a && uptime"
    
    # 2. สำรองข้อมูลฐานข้อมูลเดิม (db.json) ก่อนทำการอัปเดต เพื่อความปลอดภัยสูงสุด
    - |
      ssh -o StrictHostKeyChecking=no "$PROD_SSH_USER@$PROD_SERVER_IP" "
        mkdir -p $PROD_BACKUP_DIR
        if [ -f $PROD_APP_DIR/data/db.json ]; then
          BACKUP_FILE=$PROD_BACKUP_DIR/db_\$(date +%Y%m%d_%H%M%S).json
          cp $PROD_APP_DIR/data/db.json \$BACKUP_FILE
          echo '✅ Data backup created at:' \$BACKUP_FILE
          # เก็บประวัติ Backup ย้อนหลัง 10 ไฟล์ล่าสุด
          ls -1t $PROD_BACKUP_DIR/db_*.json | tail -n +11 | xargs -r rm -f
        fi
      "

    # 3. สร้างไดเรกทอรีโครงสร้างที่จำเป็นบน Production Server
    - |
      ssh -o StrictHostKeyChecking=no "$PROD_SSH_USER@$PROD_SERVER_IP" "
        mkdir -p $PROD_APP_DIR/dist \
                 $PROD_APP_DIR/server \
                 $PROD_APP_DIR/data/targets/blackbox \
                 $PROD_APP_DIR/data/targets/snmp \
                 /etc/prometheus/targets/blackbox \
                 /etc/prometheus/targets/snmp \
                 /etc/nginx/sites-available
      "

    # 4. Sync ไฟล์ Frontend Release Bundle (dist/) ขึ้น Production
    - echo "📦 Uploading Frontend Bundle (dist/)..."
    - rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" dist/ "$PROD_SSH_USER@$PROD_SERVER_IP:$PROD_APP_DIR/dist/"

    # 5. Sync ไฟล์ Backend Sourcecode (server/) โดยไม่ลบ node_modules บน Server
    - echo "📦 Uploading Backend Engine (server/)..."
    - rsync -avz --exclude="node_modules" -e "ssh -o StrictHostKeyChecking=no" server/ "$PROD_SSH_USER@$PROD_SERVER_IP:$PROD_APP_DIR/server/"

    # 6. Sync ค่าคอนฟิก Nginx, Docker Compose, และ Prometheus Templates
    - echo "📦 Uploading System Configurations & Compose files..."
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no" config/ "$PROD_SSH_USER@$PROD_SERVER_IP:$PROD_APP_DIR/config/"
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no" docker-compose.yml Dockerfile package.json "$PROD_SSH_USER@$PROD_SERVER_IP:$PROD_APP_DIR/"

    # 7. สั่ง Reload Service แบบ Zero-Downtime บน Production (Auto-detect ระหว่าง Docker Compose หรือ PM2)
    - echo "🔄 Restarting NetMonitor Services on Production Host..."
    - |
      ssh -o StrictHostKeyChecking=no "$PROD_SSH_USER@$PROD_SERVER_IP" "
        set -e
        cd $PROD_APP_DIR

        # กรณี Production รันด้วย Docker Compose
        if [ -f docker-compose.yml ] && (command -v docker-compose >/dev/null 2>&1 || docker compose version >/dev/null 2>&1); then
          echo '🐋 Deploying via Docker Compose on Production...'
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d --build
          else
            docker-compose up -d --build
          fi
          echo '✅ Docker Compose services updated and running.'

        # กรณี Production รันด้วย Native Node.js + PM2 / Systemd
        else
          echo '⚙️ Deploying via Native PM2 / Process Manager...'
          cd $PROD_APP_DIR/server
          npm ci --omit=dev --prefer-offline || npm install --omit=dev

          if command -v pm2 >/dev/null 2>&1; then
            echo 'Reloading via PM2...'
            pm2 reload netmonitor-backend || pm2 restart netmonitor-backend || pm2 start server.js --name netmonitor-backend
            pm2 save || true
          elif systemctl is-active --quiet netmonitor-backend; then
            echo 'Restarting via Systemd...'
            systemctl restart netmonitor-backend
          else
            echo 'Starting server in background...'
            nohup node server.js > /var/log/netmonitor.log 2>&1 &
          fi

          # ตรวจสอบและ Reload Nginx หากมีคอนฟิกใหม่
          if [ -f $PROD_APP_DIR/config/nginx/netmonitor.conf ]; then
            cp $PROD_APP_DIR/config/nginx/netmonitor.conf /etc/nginx/sites-available/netmonitor.conf
            ln -sf /etc/nginx/sites-available/netmonitor.conf /etc/nginx/sites-enabled/default 2>/dev/null || true
            nginx -t && systemctl reload nginx || true
          fi
        fi
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
    url: http://${PROD_SERVER_IP}

# -----------------------------------------------------------------------------
# 4. VERIFY STAGE: ยิงทดสอบ Health Check ตรวจสอบความสมบูรณ์ของระบบหลัง Deploy
# -----------------------------------------------------------------------------
verify:health_check:
  stage: verify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl bash
  script:
    - echo "🔍 Verifying NetMonitor Production Health on http://$PROD_SERVER_IP/api/health..."
    - |
      MAX_RETRIES=15
      RETRY_COUNT=0
      SUCCESS=false

      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "http://$PROD_SERVER_IP/api/health" || true)
        if [ "$STATUS" = "200" ]; then
          echo "✅ Health check PASSED! HTTP 200 received from Production Server."
          curl -s "http://$PROD_SERVER_IP/api/health"
          echo ""
          SUCCESS=true
          break
        else
          echo "⏳ Waiting for backend to respond... (Attempt $((RETRY_COUNT+1))/$MAX_RETRIES, HTTP: $STATUS)"
          sleep 3
          RETRY_COUNT=$((RETRY_COUNT+1))
        fi
      done

      if [ "$SUCCESS" = false ]; then
        echo "❌ [FATAL] Health check TIMED OUT! Production service did not return HTTP 200."
        exit 1
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
