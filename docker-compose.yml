version: '3.8'

# =============================================================================
# NetMonitor Enterprise Orchestration Stack
# Fully Parameterized, Hardened, Turn-key Production Deployment
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Reverse Proxy Gateway (Nginx) - Single Entry Point for All Ingress
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: netmonitor-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./config/nginx/netmonitor.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - frontend_dist:/var/www/netmonitor-react/dist:ro
    depends_on:
      netmonitor:
        condition: service_healthy
    networks:
      - netmonitor-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 16M

  # ---------------------------------------------------------------------------
  # 2. Application Core Service (Node.js REST API & Real-time SSE Engine)
  # ---------------------------------------------------------------------------
  netmonitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netmonitor-app
    restart: unless-stopped
    ports:
      # Bound strictly to localhost to prevent direct unauthenticated external bypass
      - "127.0.0.1:${PORT:-5001}:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - ORG_NAME=${ORG_NAME:-Enterprise Network Operations Center}
      - PROMETHEUS_URL=http://prometheus:9090
      - PROMETHEUS_TARGETS_DIR=/etc/prometheus/targets
      - SNMP_EXPORTER_URL=http://snmp-exporter:9116
      - BLACKBOX_EXPORTER_URL=http://blackbox-exporter:9115
      - GRAFANA_URL=http://grafana:3000
      - PROMETHEUS_SCRAPE_INTERVAL=${PROMETHEUS_SCRAPE_INTERVAL:-15s}
      - DEFAULT_DISCOVERY_CIDR=${DEFAULT_DISCOVERY_CIDR:-192.168.1.0/24}
      - DEFAULT_SNMP_COMMUNITY=${DEFAULT_SNMP_COMMUNITY:-public}
      - DEFAULT_SNMP_MODULE=${DEFAULT_SNMP_MODULE:-if_mib}
      - WAN_INTERFACE=${WAN_INTERFACE:-auto}
      - WAN_IP=${WAN_IP:-}
      - EMERGENCY_USERNAME=${EMERGENCY_USERNAME:-admin}
      - EMERGENCY_PASSWORD=${EMERGENCY_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      - LINE_USER_ID=${LINE_USER_ID:-}
      - GENERIC_WEBHOOK_URL=${GENERIC_WEBHOOK_URL:-}
    volumes:
      - ./data:/app/data
      - prometheus_targets:/etc/prometheus/targets
      - frontend_dist:/app/dist
    networks:
      - netmonitor-net
    depends_on:
      - prometheus
      - blackbox-exporter
      - snmp-exporter
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 64M

  # ---------------------------------------------------------------------------
  # 3. Prometheus Time Series Database (TSDB)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.45.3
    container_name: netmonitor-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-50GB}'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_targets:/etc/prometheus/targets
      - prometheus_data:/prometheus
    ports:
      # Protected port: Expose strictly to localhost for administrator debugging
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - netmonitor-net
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M
        reservations:
          cpus: '0.15'
          memory: 128M

  # ---------------------------------------------------------------------------
  # 4. Blackbox Exporter (ICMP Ping Latency & Reachability Prober)
  # ---------------------------------------------------------------------------
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: netmonitor-blackbox
    restart: unless-stopped
    cap_add:
      - NET_RAW
    volumes:
      - ./config/prometheus/blackbox.yml:/config/blackbox.yml:ro
    ports:
      - "127.0.0.1:${BLACKBOX_EXPORTER_PORT:-9115}:9115"
    networks:
      - netmonitor-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 16M

  # ---------------------------------------------------------------------------
  # 5. SNMP Exporter (High-Performance Hardware Metrics Proxy)
  # ---------------------------------------------------------------------------
  snmp-exporter:
    image: prom/snmp-exporter:v0.24.1
    container_name: netmonitor-snmp
    restart: unless-stopped
    volumes:
      - ./config/snmp_exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    ports:
      - "127.0.0.1:${SNMP_EXPORTER_PORT:-9116}:9116"
    networks:
      - netmonitor-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M

  # ---------------------------------------------------------------------------
  # 6. Grafana Analytics & Telemetry Dashboard (Optional Embedded Visualization)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:10.2.3
    container_name: netmonitor-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_change_on_first_login}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks:
      - netmonitor-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

# =============================================================================
# Persistent Data Volumes
# =============================================================================
volumes:
  prometheus_targets:
    name: netmonitor_prometheus_targets
  prometheus_data:
    name: netmonitor_prometheus_data
  grafana_data:
    name: netmonitor_grafana_data
  frontend_dist:
    name: netmonitor_frontend_dist

# =============================================================================
# Isolated Internal Network
# =============================================================================
networks:
  netmonitor-net:
    name: netmonitor_internal_network
    driver: bridge
