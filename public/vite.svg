<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />

  <!-- Network Topology Nodes & Connections -->
  <g stroke="#030712" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Links -->
    <line x1="32" y1="16" x2="16" y2="44" />
    <line x1="32" y1="16" x2="48" y2="44" />
    <line x1="16" y1="44" x2="48" y2="44" />
    <line x1="32" y1="16" x2="32" y2="34" />
    <line x1="16" y1="44" x2="32" y2="34" />
    <line x1="48" y1="44" x2="32" y2="34" />
  </g>

  <!-- Nodes with Dark Fill -->
  <circle cx="32" cy="16" r="6" fill="#030712" stroke="#ffffff" stroke-width="2" />
  <circle cx="16" cy="44" r="5.5" fill="#030712" stroke="#ffffff" stroke-width="2" />
  <circle cx="48" cy="44" r="5.5" fill="#030712" stroke="#ffffff" stroke-width="2" />
  <circle cx="32" cy="34" r="4.5" fill="#00d4ff" stroke="#030712" stroke-width="2" />
</svg>
