# =============================================================================
# NetMonitor Production Nginx Configuration
# Reverse Proxy for Frontend SPA, Node.js Backend API, SSE Streams,
# Prometheus, and Grafana.
# =============================================================================

server {
    listen 80;
    server_name _ netmonitor.local netmonitor.seavl.local netmonitor;

    root /var/www/netmonitor-react/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Static Assets Caching (Vite hashed files)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Grafana Dashboard (Port 3000)
    location ^~ /api/grafana/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /api/grafana-auth/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Prometheus Proxy (Port 9090)
    location ^~ /api/prometheus/ {
        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Dedicated SSE Stream Endpoint (Real-time Events: Alerts & Traffic)
    # Zero buffering, no caching, and extended keepalive timeouts
    location ~* ^/api/storage/stream/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Unified Backend REST API (Port 5001)
    # Handles /api/health, /api/auth/, /api/storage/, /api/alerts/, /api/devices/
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend SPA Route Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
