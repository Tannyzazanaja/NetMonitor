# =============================================================================
# NetMonitor Enterprise Nginx Configuration
# Hardened Reverse Proxy for Frontend SPA, REST API, SSE Streams,
# Prometheus, and Grafana.
# =============================================================================

# Upstream definitions for containerized network services
upstream netmonitor_backend {
    server netmonitor:5001;
    keepalive 32;
}

upstream prometheus_backend {
    server prometheus:9090;
    keepalive 16;
}

upstream grafana_backend {
    server grafana:3000;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# HTTP Server (Port 80)
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name _ localhost;

    root /var/www/netmonitor-react/dist;
    index index.html;

    # Enterprise Security Headers (OWASP Recommended)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'self';" always;

    # Gzip High-Performance Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Static Assets Caching (Vite hash-versioned assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Embedded Grafana Dashboard Proxy (Port 3000)
    location ^~ /api/grafana/ {
        proxy_pass http://grafana_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/grafana-auth/ {
        proxy_pass http://grafana_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus Reverse Proxy (Restricted Access via Nginx)
    location ^~ /api/prometheus/ {
        proxy_pass http://prometheus_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Real-Time Server-Sent Events (SSE) Stream
    # Zero buffering, uncompressed chunking, long keepalive
    location ~* ^/api/storage/stream/ {
        proxy_pass http://netmonitor_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Unified Node.js REST API
    location /api/ {
        proxy_pass http://netmonitor_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Frontend SPA Route Fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

