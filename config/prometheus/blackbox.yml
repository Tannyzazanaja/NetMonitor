# =============================================================================
# NetMonitor Enterprise Blackbox Exporter Configuration
# =============================================================================
modules:
  # ICMP Ping Reachability & Latency (Dedicated for Blackbox job)
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  # HTTP/HTTPS Health Checks
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      method: GET
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true

  # TCP Port Connectivity
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
