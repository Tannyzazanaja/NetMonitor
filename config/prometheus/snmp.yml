auths:
  public_v1:
    community: public
    version: 1
  public_v2:
    community: public
    version: 2

# =============================================================================
# OPTIMIZED SNMP EXPORTER MODULES (Cisco & Aruba / HPE Switches)
# =============================================================================
# Append these modules into /etc/prometheus/snmp.yml under the `modules:` block.
# Designed for high performance and low scrape duration:
# - Minimal walks: only walks necessary OIDs (Interfaces, LLDP/CDP, CPU, Memory)
# - No bloated table walks (prevents scrape timeout on large switches)
# =============================================================================

modules:
  # ---------------------------------------------------------------------------
  # Cisco Catalyst / IOS-XE Switch (All-in-One: Traffic + LLDP/CDP + CPU + Mem)
  # ---------------------------------------------------------------------------
  cisco_switch:
    walk:
      # LLDP Neighbors
      - 1.0.8802.1.1.2.1.4.1.1.7
      - 1.0.8802.1.1.2.1.4.1.1.8
      - 1.0.8802.1.1.2.1.4.1.1.9
      # CDP Neighbors
      - 1.3.6.1.4.1.9.9.23.1.2.1.1.6
      - 1.3.6.1.4.1.9.9.23.1.2.1.1.7
      - 1.3.6.1.4.1.9.9.23.1.2.1.1.8
      # Standard Interfaces (64-bit HC counters)
      - 1.3.6.1.2.1.2.2.1.1
      - 1.3.6.1.2.1.2.2.1.2
      - 1.3.6.1.2.1.2.2.1.7
      - 1.3.6.1.2.1.2.2.1.8
      - 1.3.6.1.2.1.31.1.1.1.1
      - 1.3.6.1.2.1.31.1.1.1.6
      - 1.3.6.1.2.1.31.1.1.1.10
      - 1.3.6.1.2.1.31.1.1.1.18
      # Cisco CPU 5-minute utilization
      - 1.3.6.1.4.1.9.9.109.1.1.1.1.5
      # Cisco Memory Pool (Used & Free)
      - 1.3.6.1.4.1.9.9.48.1.1.1.5
      - 1.3.6.1.4.1.9.9.48.1.1.1.6
    metrics:
      - name: lldpRemSysName
        oid: 1.0.8802.1.1.2.1.4.1.1.9
        type: DisplayString
        help: System name of remote LLDP neighbor
        indexes:
          - labelname: lldpRemTimeMark
            type: gauge
          - labelname: lldpRemLocalPortNum
            type: gauge
          - labelname: lldpRemIndex
            type: gauge
      - name: lldpRemPortDesc
        oid: 1.0.8802.1.1.2.1.4.1.1.8
        type: DisplayString
        help: Port description of remote LLDP neighbor
        indexes:
          - labelname: lldpRemTimeMark
            type: gauge
          - labelname: lldpRemLocalPortNum
            type: gauge
          - labelname: lldpRemIndex
            type: gauge
      - name: lldpRemPortId
        oid: 1.0.8802.1.1.2.1.4.1.1.7
        type: DisplayString
        help: Port ID of remote LLDP neighbor
        indexes:
          - labelname: lldpRemTimeMark
            type: gauge
          - labelname: lldpRemLocalPortNum
            type: gauge
          - labelname: lldpRemIndex
            type: gauge
      - name: cdpCacheDeviceId
        oid: 1.3.6.1.4.1.9.9.23.1.2.1.1.6
        type: DisplayString
        help: Remote Device ID reported in CDP message
        indexes:
          - labelname: cdpCacheIfIndex
            type: gauge
          - labelname: cdpCacheDeviceIndex
            type: gauge
      - name: cdpCacheDevicePort
        oid: 1.3.6.1.4.1.9.9.23.1.2.1.1.7
        type: DisplayString
        help: Remote Port ID reported in CDP message
        indexes:
          - labelname: cdpCacheIfIndex
            type: gauge
          - labelname: cdpCacheDeviceIndex
            type: gauge
      - name: cdpCachePlatform
        oid: 1.3.6.1.4.1.9.9.23.1.2.1.1.8
        type: DisplayString
        help: Remote Device hardware platform from CDP
        indexes:
          - labelname: cdpCacheIfIndex
            type: gauge
          - labelname: cdpCacheDeviceIndex
            type: gauge
      - name: ifAdminStatus
        oid: 1.3.6.1.2.1.2.2.1.7
        type: gauge
        help: Desired administrative state of interface
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: Current operational state of interface
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: Total incoming traffic in bytes (64-bit)
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: Total outgoing traffic in bytes (64-bit)
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
        help: Interface description
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
        help: User-configured interface alias
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: cpmCPUTotal5minRev
        oid: 1.3.6.1.4.1.9.9.109.1.1.1.1.5
        type: gauge
        help: Overall Cisco CPU busy percentage in the last 5 minute period
        indexes:
          - labelname: cpmCPUTotalIndex
            type: gauge
      - name: ciscoMemoryPoolUsed
        oid: 1.3.6.1.4.1.9.9.48.1.1.1.5
        type: gauge
        help: Number of bytes currently in use in Cisco memory pool
        indexes:
          - labelname: ciscoMemoryPoolType
            type: gauge
      - name: ciscoMemoryPoolFree
        oid: 1.3.6.1.4.1.9.9.48.1.1.1.6
        type: gauge
        help: Number of bytes available in Cisco memory pool
        indexes:
          - labelname: ciscoMemoryPoolType
            type: gauge

